tabs:
  business:
    display: Business
    sections:
      -
        instructions: 'Shown on quotes, invoices and emails.'
        fields:
          -
            handle: business_name
            field:
              type: text
              display: 'Business name'
          -
            handle: business_logo
            field:
              type: assets
              display: Logo
              container: assets
              max_files: 1
          -
            handle: business_address
            field:
              type: textarea
              display: Address
          -
            handle: business_email
            field:
              type: text
              input_type: email
              display: Email
              width: 50
          -
            handle: business_phone
            field:
              type: text
              display: Phone
              width: 50
          -
            handle: business_tax_number
            field:
              type: text
              display: 'Tax / VAT number'
              width: 50
  sales:
    display: Sales
    sections:
      -
        display: Currency
        fields:
          -
            handle: currency
            field:
              type: dictionary
              dictionary: currencies
              display: 'Default currency'
              max_items: 1
              default: USD
      -
        display: Numbering
        fields:
          -
            handle: invoice_prefix
            field:
              type: text
              display: 'Invoice number prefix'
              default: INV-
              width: 50
          -
            handle: quote_prefix
            field:
              type: text
              display: 'Quote number prefix'
              default: QUO-
              width: 50
          -
            handle: payment_terms_days
            field:
              type: integer
              display: 'Invoices are due after (days)'
              default: 30
              width: 50
          -
            handle: quote_valid_days
            field:
              type: integer
              display: 'Quotes are valid for (days)'
              default: 30
              width: 50
      -
        display: Taxes
        fields:
          -
            handle: tax_rates
            field:
              type: grid
              display: 'Tax rates'
              instructions: 'Pick one of these on each line of a quote or invoice.'
              add_row: 'Add tax rate'
              fields:
                -
                  handle: name
                  field:
                    type: text
                    display: Name
                    validate:
                      - required
                -
                  handle: rate
                  field:
                    type: float
                    display: 'Rate (%)'
                    validate:
                      - required
                      - numeric
                      - min:0
          -
            handle: prices_include_tax
            field:
              type: toggle
              display: 'Prices include tax'
              instructions: 'Off: tax is added on top of line prices. On: line prices already include tax.'
      -
        display: 'Default text'
        fields:
          -
            handle: invoice_terms
            field:
              type: textarea
              display: 'Invoice terms / payment instructions'
          -
            handle: quote_terms
            field:
              type: textarea
              display: 'Quote terms'
  capture:
    display: 'Lead capture'
    sections:
      -
        display: Forms
        instructions: 'Submissions to these Statamic forms create or update contacts, matched by email. Fields named like email, name, first_name, last_name, phone and company — or any contact field handle — are mapped automatically.'
        fields:
          -
            handle: capture_forms
            field:
              type: form
              display: 'Capture these forms'
              max_items: 50
          -
            handle: capture_status
            field:
              type: text
              display: 'Status for new contacts'
              default: lead
              width: 50
          -
            handle: capture_tags
            field:
              type: list
              display: 'Tags to add'
              instructions: 'The form’s title is added as a tag too.'
              width: 50
          -
            handle: capture_note
            field:
              type: toggle
              display: 'Save other fields as a note'
              default: true
      -
        display: Registrations
        fields:
          -
            handle: capture_registrations
            field:
              type: toggle
              display: 'Add users who register to the CRM'
          -
            handle: registration_status
            field:
              type: text
              display: 'Status for new contacts'
              default: lead
              width: 50
          -
            handle: registration_tags
            field:
              type: list
              display: 'Tags to add'
              width: 50
  email:
    display: Email
    sections:
      -
        display: Campaigns
        instructions: 'Campaigns send in batches every minute via the Laravel scheduler (`php artisan schedule:run`). Keep batches within your mail provider’s rate limit.'
        fields:
          -
            handle: campaign_batch_size
            field:
              type: integer
              display: 'Emails per minute'
              default: 100
              validate:
                - 'min:1'
