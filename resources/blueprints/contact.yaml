title: Contact
tabs:
  main:
    display: Details
    sections:
      -
        display: Contact
        fields:
          -
            handle: first_name
            field:
              type: text
              display: 'First name'
              width: 50
          -
            handle: last_name
            field:
              type: text
              display: 'Last name'
              width: 50
          -
            handle: email
            field:
              type: text
              input_type: email
              display: Email
              width: 50
              validate:
                - nullable
                - email
          -
            handle: phone
            field:
              type: text
              input_type: tel
              display: Phone
              width: 50
          -
            handle: aliases
            field:
              type: list
              display: 'Other email addresses'
              instructions: 'Emails from these addresses are matched to this contact too.'
          -
            handle: company
            field:
              type: crm_companies
              display: Company
              max_items: 1
              mode: select
      -
        display: Address
        fields:
          -
            handle: address_line_1
            field:
              type: text
              display: 'Address line 1'
          -
            handle: address_line_2
            field:
              type: text
              display: 'Address line 2'
          -
            handle: city
            field:
              type: text
              display: City
              width: 50
          -
            handle: region
            field:
              type: text
              display: 'State / county'
              width: 50
          -
            handle: postcode
            field:
              type: text
              display: Postcode
              width: 50
          -
            handle: country
            field:
              type: dictionary
              dictionary: countries
              display: Country
              max_items: 1
              width: 50
      -
        display: Social
        fields:
          -
            handle: website
            field:
              type: text
              input_type: url
              display: Website
              width: 50
          -
            handle: linkedin
            field:
              type: text
              input_type: url
              display: LinkedIn
              width: 50
          -
            handle: twitter
            field:
              type: text
              display: 'X / Twitter'
              width: 50
          -
            handle: facebook
            field:
              type: text
              input_type: url
              display: Facebook
              width: 50
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: status
            field:
              type: select
              display: Status
              default: lead
              options:
                lead: Lead
                customer: Customer
                refused: Refused
                blacklisted: Blacklisted
              validate:
                - required
          -
            handle: owner
            field:
              type: users
              display: Owner
              max_items: 1
              mode: select
          -
            handle: portal_user
            field:
              type: users
              display: 'Portal user'
              instructions: "The user account that sees this contact's invoices, quotes, payments and shared files in the client portal. Only link an account you know belongs to this contact."
              max_items: 1
              mode: select
          -
            handle: tags
            field:
              type: taggable
              display: Tags
